<aside class="profile-sidebar">

  <button
    type="button"
    class="sidebar-item"
    routerLink="/meu-perfil"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }">

    <i class="bi bi-person"></i>
    <span>Editar Perfil</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/perfil-publico"
    routerLinkActive="active">

    <i class="bi bi-person-badge"></i>
    <span>Perfil Público</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/titulos-seguidos"
    routerLinkActive="active">

    <i class="bi bi-bookmark"></i>
    <span>Títulos Seguidos</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/usuarios-seguidos"
    routerLinkActive="active">

    <i class="bi bi-person-plus"></i>
    <span>Usuários Seguidos</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/grupos-seguidos"
    routerLinkActive="active">

    <i class="bi bi-people"></i>
    <span>Grupos Seguidos</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/historico-leitura"
    routerLinkActive="active">

    <i class="bi bi-clock-history"></i>
    <span>Histórico de Leitura</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/colecoes"
    routerLinkActive="active">

    <i class="bi bi-collection"></i>
    <span>Coleções</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/notificacoes"
    routerLinkActive="active">

    <i class="bi bi-bell"></i>
    <span>Notificações</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/minhas-publicacoes"
    routerLinkActive="active">

    <i class="bi bi-file-earmark-text"></i>
    <span>Minhas Publicações</span>
  </button>


  <button
    type="button"
    class="sidebar-item"
    routerLink="/configuracoes"
    routerLinkActive="active">

    <i class="bi bi-gear"></i>
    <span>Configurações</span>
  </button>

</aside>
